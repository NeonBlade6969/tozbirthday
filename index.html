<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy 16th Birthday Toz! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #FFF7ED;
      --card-bg: #FFFFFF;
      --envelope-base: #F7E5C8;
      --envelope-interior: #E8D3B0;
      --envelope-flap: #F5DFB8;
      --envelope-side: #ECD2A8;
      --envelope-front: #E2C394;
      --accent: #FF6B8B;
      --accent-soft: #FFE3E8;
      --primary: #59352A;
      --muted: #8F7265;
      --border-color: #EED7C5;
      --cake-frosting: #FFF3E6;
      --cake-sponge: #FFD2DC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#F5DFC9 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      font-family: 'Nunito', sans-serif;
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 80px;
      overflow-x: hidden;
      position: relative;
    }

    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.75;
      animation: floatUp 14s infinite linear;
      bottom: -70px;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: #C4A482;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; }
    }

    .scene-wrap {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 10;
      perspective: 1400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .envelope-pocket {
      position: relative;
      width: 100%;
      max-width: 540px;
      height: 360px;
      background: var(--envelope-base);
      border-radius: 0 0 24px 24px;
      box-shadow: 0 20px 45px rgba(89, 53, 42, 0.16);
      transform-style: preserve-3d;
      transition: height 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .envelope-pocket.is-open {
      height: auto;
      min-height: 360px;
    }

    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      border-left: 270px solid transparent;
      border-right: 270px solid transparent;
      border-top: 185px solid var(--envelope-flap);
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.3s;
      z-index: 20;
      cursor: pointer;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
    }

    .envelope-pocket.is-open .env-flap {
      transform: rotateX(180deg);
      z-index: 2;
    }

    .heart-seal {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 62px;
      height: 62px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 6px 18px rgba(255, 107, 139, 0.45);
      border: 3px solid #FFF;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 25;
    }

    .envelope-pocket.is-open .heart-seal {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.5);
    }

    .heart-seal span {
      font-size: 22px;
      line-height: 1;
    }

    .heart-seal small {
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
    }

    .env-side-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 180px solid transparent;
      border-bottom: 180px solid var(--envelope-side);
      border-left: 270px solid var(--envelope-side);
      z-index: 15;
      pointer-events: none;
    }

    .env-side-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 180px solid transparent;
      border-bottom: 180px solid var(--envelope-side);
      border-right: 270px solid var(--envelope-side);
      z-index: 15;
      pointer-events: none;
    }

    .env-bottom-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 270px solid transparent;
      border-right: 270px solid transparent;
      border-bottom: 195px solid var(--envelope-front);
      border-radius: 0 0 24px 24px;
      z-index: 16;
      pointer-events: none;
    }

    .airmail-badge {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 18;
      background: #FFFFFF;
      padding: 10px 24px;
      border-radius: 30px;
      border: 2px dashed #D6B286;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      transition: opacity 0.4s ease, transform 0.4s ease;
      cursor: pointer;
    }

    .envelope-pocket.is-open .airmail-badge {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(10px);
    }

    .airmail-badge .tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .airmail-badge .to {
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
    }

    .open-prompt {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s;
    }

    .envelope-pocket.is-open ~ .open-prompt {
      opacity: 0;
      pointer-events: none;
    }

    .card-wrap {
      width: calc(100% - 24px);
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 30px 24px 28px;
      position: relative;
      z-index: 8;
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.9s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.6s ease, z-index 0.1s;
    }

    .envelope-pocket.is-open .card-wrap {
      transform: translateY(-80px);
      opacity: 1;
      pointer-events: auto;
      z-index: 25;
      margin-bottom: -40px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-title span {
      color: var(--accent);
    }

    .birthday-quote {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: #9E5A47;
      text-align: center;
      margin: 4px 0 16px;
    }

    .cake-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #FFF9F3;
      border: 1.5px dashed #F0D5C3;
      border-radius: 22px;
      padding: 22px 16px 16px;
      margin-bottom: 24px;
      position: relative;
    }

    .cake-container {
      position: relative;
      width: 220px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      user-select: none;
    }

    .cake-plate {
      width: 210px;
      height: 12px;
      background: #EDE1D5;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(90, 50, 30, 0.1);
      position: relative;
      z-index: 1;
    }

    .cake-tier-bottom {
      width: 170px;
      height: 52px;
      background: var(--cake-sponge);
      border-radius: 14px 14px 4px 4px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .cake-tier-bottom::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: var(--cake-frosting);
      border-radius: 0 0 8px 8px;
    }

    .cake-tier-bottom::after {
      content: '🍓 🌸 🍓 🌸 🍓';
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .cake-tier-top {
      width: 120px;
      height: 42px;
      background: #FFE0E7;
      border-radius: 12px 12px 3px 3px;
      position: relative;
      z-index: 3;
      margin-bottom: -4px;
      overflow: hidden;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05);
    }

    .frosting-drips {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 15px;
      background: var(--cake-frosting);
      border-radius: 0 0 10px 10px;
      box-shadow: 0 2px 4px rgba(255, 107, 139, 0.15);
    }

    .frosting-drips::after {
      content: '• • • • •';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      text-align: center;
      color: #FF8FA3;
      font-size: 14px;
      letter-spacing: 8px;
    }

    .candles-wrapper {
      display: flex;
      gap: 24px;
      position: absolute;
      top: 10px;
      z-index: 4;
    }

    .candle-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .candle-unit .stick {
      width: 10px;
      height: 38px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        45deg,
        #FF8FA3,
        #FF8FA3 5px,
        #FFF 5px,
        #FFF 10px
      );
      box-shadow: inset -1px 0 2px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.08);
      position: relative;
    }

    .candle-unit .wick {
      width: 2px;
      height: 6px;
      background: #735144;
    }

    .candle-unit .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(ellipse at bottom, #FFF7A1 20%, #FFA834 65%, #FF5900 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 16px #FFA500, 0 0 30px #FFD56B;
      animation: flicker 0.9s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
      transform-origin: bottom center;
      transition: all 0.3s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.08, 1.15) rotate(2deg); }
      100% { transform: scale(0.96) rotate(-2deg); }
    }

    .flame.blown {
      opacity: 0;
      transform: translateY(-12px) scale(0.1);
      box-shadow: none;
    }

    .smoke {
      position: absolute;
      top: -10px;
      width: 8px;
      height: 12px;
      background: #D8D2CD;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .smoke.active {
      animation: smokeRise 1.2s forwards ease-out;
    }

    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(2.4); filter: blur(4px); }
    }

    .cake-hint {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .cake-hint:hover {
      color: var(--accent);
    }

    .tabs-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #F8EFE6;
      border: 1.5px solid transparent;
      border-radius: 50px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #F1E4D6;
    }

    .tab-btn.active {
      background: #FFFFFF;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.16);
    }

    .tab-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: #F1D4CA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      overflow: hidden;
    }

    .tab-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wish-box {
      background: #FFFDF9;
      border: 1.5px solid #F1E2D4;
      border-radius: 20px;
      padding: 22px;
      position: relative;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(93, 56, 42, 0.04);
    }

    .wish-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .big-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: #F7E4DE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }

    .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wish-meta h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
    }

    .wish-meta span {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .wish-text {
      font-size: 15px;
      line-height: 1.6;
      color: #634335;
      position: relative;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reclose-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .reclose-btn:hover {
      background: #F8ECE0;
      color: var(--primary);
    }

    @media (max-width: 580px) {
      .envelope-pocket {
        max-width: 95vw;
        height: 250px;
      }
      .env-flap {
        border-left-width: 47.5vw;
        border-right-width: 47.5vw;
        border-top-width: 130px;
      }
      .heart-seal {
        top: -110px;
        width: 52px;
        height: 52px;
      }
      .env-side-left {
        border-top-width: 125px;
        border-bottom-width: 125px;
        border-left-width: 47.5vw;
      }
      .env-side-right {
        border-top-width: 125px;
        border-bottom-width: 125px;
        border-right-width: 47.5vw;
      }
      .env-bottom-front {
        border-left-width: 47.5vw;
        border-right-width: 47.5vw;
        border-bottom-width: 135px;
      }
      .airmail-badge {
        bottom: 16px;
        padding: 6px 16px;
      }
      .card-wrap {
        padding: 24px 16px;
      }
      .card-title {
        font-size: 26px;
      }
      .envelope-pocket.is-open .card-wrap {
        transform: translateY(-50px);
      }
    }
  </style>
</head>
<body>

  <div class="balloon-layer" id="balloonLayer"></div>

  <div class="scene-wrap">

    <div class="envelope-pocket" id="envelopePocket">
      <div class="env-flap" onclick="toggleEnvelope()">
        <div class="heart-seal">
          <span>💌</span>
          <small>OPEN</small>
        </div>
      </div>

      <div class="card-wrap" id="birthdayCard">
        <div class="card-header">
          <div class="date-pill">🗓️ November 3rd • Sweet 16th</div>
          <h1 class="card-title">Happy Birthday, <span>Toz!</span> 🎉</h1>
          <p class="birthday-quote">"Wishing you the brightest year full of laughter, love & memories!"</p>
        </div>

        <div class="cake-showcase">
          <div class="cake-container" onclick="toggleCandles()" title="Tap to blow out or relight the candles!">
            <div class="candles-wrapper">
              <div class="candle-unit">
                <div class="smoke" id="smoke1"></div>
                <div class="flame" id="flame1"></div>
                <div class="wick"></div>
                <div class="stick"></div>
              </div>
              <div class="candle-unit">
                <div class="smoke" id="smoke2"></div>
                <div class="flame" id="flame2"></div>
                <div class="wick"></div>
                <div class="stick"></div>
              </div>
            </div>

            <div class="cake-tier-top">
              <div class="frosting-drips"></div>
            </div>

            <div class="cake-tier-bottom"></div>

            <div class="cake-plate"></div>
          </div>

          <div class="cake-hint" id="candleStatus" onclick="toggleCandles()">
            Tap candles to make a 16th wish & blow them out 💨
          </div>
        </div>

        <span class="tabs-label">Messages from friends:</span>
        <div class="tabs-bar" id="tabsBar"></div>

        <div class="wish-box" id="wishBox">
          <div class="wish-header">
            <div class="big-avatar" id="authorAvatar"></div>
            <div class="wish-meta">
              <h3 id="authorName">Cas</h3>
              <span id="authorRole">Bestie</span>
            </div>
          </div>
          <p class="wish-text" id="wishContent"></p>
        </div>

        <div class="card-actions">
          <button class="reclose-btn" onclick="toggleEnvelope()">
            ✉️ Put card back in envelope
          </button>
        </div>
      </div>

      <div class="env-side-left"></div>
      <div class="env-side-right"></div>
      <div class="env-bottom-front"></div>

      <div class="airmail-badge" onclick="toggleEnvelope()">
        <div class="tag">Special Delivery</div>
        <div class="to">For Toz on her 16th 🎀</div>
      </div>
    </div>
    
    <div class="open-prompt" id="openPrompt">
      <span>✨ Tap the envelope to unseal</span>
    </div>

  </div>

  <script>
    function playRipSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.35;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const envelope = Math.sin(t * Math.PI) * Math.pow(1 - t, 0.4);
          const crackle = Math.random() > 0.85 ? (Math.random() * 2 - 1) * 1.5 : (Math.random() * 2 - 1) * 0.5;
          data[i] = crackle * envelope;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.35);
        filter.Q.setValueAtTime(1.8, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noise.start();
      } catch (e) {}
    }

    const wishes = [
      {
        id: "cas",
        name: "Cas",
        role: "Friend",
        img: "cas.png",

      {
        id: "sweet",

        img: "sweet.png",
        message: "Toz, sweetest 16th to you! 🌸 You have such a kind and vibrant heart, and every memory we make together is unforgettable. May this year bring you all the success, happiness, and peace in the world. Enjoy every single moment of your special day! 🍰✨"

      {
        id: "tsumiki",

    let activeTabId = "cas";
    let candlesBlown = false;

    function renderTabs() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.innerHTML = '';

      wishes.forEach(friend => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${friend.id === activeTabId ? 'active' : ''}`;
        btn.onclick = (e) => {
          e.stopPropagation();
          selectTab(friend.id);
        };

        btn.innerHTML = `
          <div class="tab-avatar">
            <img src="${friend.img}" alt="${friend.name}" onerror="this.onerror=null; this.parentElement.innerText='${friend.name[0]}';">
          </div>
          <span>${friend.name}</span>
        `;
        tabsBar.appendChild(btn);
      });

      renderCurrentWish();
    }

    function selectTab(id) {
      activeTabId = id;
      renderTabs();
    }

    function renderCurrentWish() {
      const current = wishes.find(w => w.id === activeTabId) || wishes[0];
      
      document.getElementById('authorName').innerText = current.name;
      document.getElementById('authorRole').innerText = current.role;
      document.getElementById('wishContent').innerText = `"${current.message}"`;

      const avatarBox = document.getElementById('authorAvatar');
      avatarBox.innerHTML = `
        <img src="${current.img}" alt="${current.name}" onerror="this.onerror=null; this.parentElement.innerText='${current.name[0]}';">
      `;
    }

    function toggleEnvelope() {
      const pocket = document.getElementById('envelopePocket');
      const isOpen = pocket.classList.contains('is-open');

      if (!isOpen) {
        playRipSound();
        pocket.classList.add('is-open');
        setTimeout(() => {
          fireConfettiBurst();
        }, 300);
      } else {
        pocket.classList.remove('is-open');
      }
    }

    function fireConfettiBurst() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#FF6B8B', '#FFD166', '#06D6A0', '#118AB2', '#FFAAA6']
        });
        setTimeout(() => {
          confetti({
            particleCount: 45,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 45,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
        }, 220);
      }
    }

    function toggleCandles(e) {
      if (e) e.stopPropagation();
      const f1 = document.getElementById('flame1');
      const f2 = document.getElementById('flame2');
      const s1 = document.getElementById('smoke1');
      const s2 = document.getElementById('smoke2');
      const status = document.getElementById('candleStatus');

      candlesBlown = !candlesBlown;

      if (candlesBlown) {
        f1.classList.add('blown');
        f2.classList.add('blown');
        
        s1.classList.remove('active');
        s2.classList.remove('active');
        void s1.offsetWidth;
        s1.classList.add('active');
        s2.classList.add('active');

        status.innerHTML = "✨ Wish granted! Happy 16th Toz! (Tap to relight) 🕯️";
        fireConfettiBurst();
      } else {
        f1.classList.remove('blown');
        f2.classList.remove('blown');
        s1.classList.remove('active');
        s2.classList.remove('active');
        status.innerHTML = "Tap candles to make a 16th wish & blow them out 💨";
      }
    }

    function createAmbientBalloons() {
      const container = document.getElementById('balloonLayer');
      const colors = ['#FFC2D1', '#FFE5D9', '#D8E2DC', '#FFE8D6', '#E8DFF5'];
      
      for (let i = 0; i < 7; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.style.left = `${Math.random() * 92 + 2}%`;
        balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.animationDelay = `${Math.random() * 8}s`;
        balloon.style.animationDuration = `${12 + Math.random() * 6}s`;
        container.appendChild(balloon);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      createAmbientBalloons();
    });
  </script>
</body>
