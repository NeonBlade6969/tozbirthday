<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy 16th Birthday Toz! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #FFF7ED;
      --card-bg: #FFFFFF;
      --envelope-base: #FCEFD8;
      --envelope-flap: #F5DFB8;
      --envelope-dark: #E6CE9F;
      --accent: #FF6B8B;
      --accent-soft: #FFE3E8;
      --primary: #59352A;
      --muted: #8F7265;
      --border-color: #EED7C5;
      --shadow: 0 16px 36px -12px rgba(93, 56, 42, 0.12);
      --cake-frosting: #FFF3E6;
      --cake-sponge: #FFD2DC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#F5DFC9 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      font-family: 'Nunito', sans-serif;
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Top Right Useless Button */
    .useless-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 100;
      background: #FFFFFF;
      border: 2px dashed var(--accent);
      color: var(--primary);
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.2);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .useless-btn:hover {
      transform: translateY(-2px) scale(1.05) rotate(-2deg);
      background: var(--accent-soft);
      box-shadow: 0 6px 20px rgba(255, 107, 139, 0.35);
    }

    .useless-btn:active {
      transform: scale(0.95);
    }

    /* Cinema Slideshow Overlay */
    .cinema-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 12, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease;
      padding: 20px;
    }

    .cinema-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* Responsive Frame that hugs images */
    .cinema-frame {
      max-width: 86vw;
      max-height: 74vh;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: movieFramePop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      background: #140E0C;
    }

    @keyframes movieFramePop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .cinema-slide {
      display: none;
      max-width: 86vw;
      max-height: 74vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 18px;
      opacity: 0;
      pointer-events: none;
    }

    /* Slow cinematic zoom without cropping borders */
    .cinema-slide.show {
      display: block;
      opacity: 1;
      animation: movieFadeZoom 4s ease-out forwards;
    }

    @keyframes movieFadeZoom {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      15% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        opacity: 0.95;
        transform: scale(1.08);
      }
    }

    .cinema-back-btn {
      margin-top: 20px;
      background: #FFFFFF;
      border: none;
      color: var(--primary);
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cinema-back-btn:hover {
      transform: scale(1.06);
      background: var(--accent);
      color: #FFFFFF;
    }

    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.75;
      animation: floatUp 14s infinite linear;
      bottom: -70px;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: #C4A482;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; }
    }

    .scene-wrap {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 10;
      perspective: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .envelope-box {
      width: 100%;
      max-width: 440px;
      height: 300px;
      background: var(--envelope-base);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(89, 53, 42, 0.16);
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--envelope-dark);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      overflow: hidden;
    }

    .envelope-box:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 24px 44px rgba(89, 53, 42, 0.2);
    }

    .env-top-tri {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 217px solid transparent;
      border-right: 217px solid transparent;
      border-top: 155px solid var(--envelope-flap);
      z-index: 4;
      transform-origin: top center;
      transition: transform 0.6s ease;
    }

    .env-bot-tri {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 217px solid transparent;
      border-right: 217px solid transparent;
      border-bottom: 140px solid var(--envelope-base);
      z-index: 3;
    }

    .env-side-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 150px solid transparent;
      border-bottom: 150px solid transparent;
      border-left: 170px solid var(--envelope-dark);
      opacity: 0.35;
      z-index: 2;
    }

    .env-side-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 150px solid transparent;
      border-bottom: 150px solid transparent;
      border-right: 170px solid var(--envelope-dark);
      opacity: 0.35;
      z-index: 2;
    }

    .heart-seal {
      position: absolute;
      top: 125px;
      z-index: 6;
      width: 60px;
      height: 60px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 6px 16px rgba(255, 107, 139, 0.45);
      border: 3px solid #FFF;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
    }

    .heart-seal span {
      font-size: 20px;
      line-height: 1;
    }

    .heart-seal small {
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .airmail-badge {
      position: absolute;
      bottom: 30px;
      z-index: 5;
      background: #FFFFFF;
      padding: 10px 22px;
      border-radius: 30px;
      border: 2px dashed #E3BFA5;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }

    .airmail-badge .tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .airmail-badge .to {
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
    }

    .open-prompt {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .card-wrap {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border-radius: 28px;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-title span {
      color: var(--accent);
    }

    .birthday-quote {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: #9E5A47;
      text-align: center;
      margin: 4px 0 16px;
    }

    .cake-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #FFF9F3;
      border: 1.5px dashed #F0D5C3;
      border-radius: 22px;
      padding: 22px 16px 16px;
      margin-bottom: 24px;
      position: relative;
    }

    .cake-container {
      position: relative;
      width: 220px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      user-select: none;
    }

    .cake-plate {
      width: 210px;
      height: 12px;
      background: #EDE1D5;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(90, 50, 30, 0.1);
      position: relative;
      z-index: 1;
    }

    .cake-tier-bottom {
      width: 170px;
      height: 52px;
      background: var(--cake-sponge);
      border-radius: 14px 14px 4px 4px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .cake-tier-bottom::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: var(--cake-frosting);
      border-radius: 0 0 8px 8px;
    }

    .cake-tier-bottom::after {
      content: '🍓 🌸 🍓 🌸 🍓';
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .cake-tier-top {
      width: 120px;
      height: 42px;
      background: #FFE0E7;
      border-radius: 12px 12px 3px 3px;
      position: relative;
      z-index: 3;
      margin-bottom: -4px;
      overflow: hidden;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05);
    }

    .frosting-drips {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 15px;
      background: var(--cake-frosting);
      border-radius: 0 0 10px 10px;
      box-shadow: 0 2px 4px rgba(255, 107, 139, 0.15);
    }

    .frosting-drips::after {
      content: '• • • • •';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      text-align: center;
      color: #FF8FA3;
      font-size: 14px;
      letter-spacing: 8px;
    }

    .candles-wrapper {
      display: flex;
      gap: 24px;
      position: absolute;
      top: 10px;
      z-index: 4;
    }

    .candle-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .candle-unit .stick {
      width: 10px;
      height: 38px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        45deg,
        #FF8FA3,
        #FF8FA3 5px,
        #FFF 5px,
        #FFF 10px
      );
      box-shadow: inset -1px 0 2px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.08);
      position: relative;
    }

    .candle-unit .wick {
      width: 2px;
      height: 6px;
      background: #735144;
    }

    .candle-unit .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(ellipse at bottom, #FFF7A1 20%, #FFA834 65%, #FF5900 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 16px #FFA500, 0 0 30px #FFD56B;
      animation: flicker 0.9s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
      transform-origin: bottom center;
      transition: all 0.3s ease;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.08, 1.15) rotate(2deg); }
      100% { transform: scale(0.96) rotate(-2deg); }
    }

    .flame.blown {
      opacity: 0;
      transform: translateY(-12px) scale(0.1);
      box-shadow: none;
    }

    .smoke {
      position: absolute;
      top: -10px;
      width: 8px;
      height: 12px;
      background: #D8D2CD;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .smoke.active {
      animation: smokeRise 1.2s forwards ease-out;
    }

    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(2.4); filter: blur(4px); }
    }

    .cake-hint {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .cake-hint:hover {
      color: var(--accent);
    }

    .tabs-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }

    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 4px;
      background: #F8EFE6;
      border: 1.5px solid transparent;
      border-radius: 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .tab-btn:hover {
      background: #F1E4D6;
    }

    .tab-btn.active {
      background: #FFFFFF;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.16);
      transform: translateY(-2px);
    }

    .tab-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .tab-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #F1D4CA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tab-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wish-box {
      background: #FFFDF9;
      border: 1.5px solid #F1E2D4;
      border-radius: 20px;
      padding: 22px;
      position: relative;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(93, 56, 42, 0.04);
    }

    .wish-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .big-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: #F7E4DE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }

    .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wish-meta h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
    }

    .wish-meta span {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .wish-text {
      font-size: 15px;
      line-height: 1.6;
      color: #634335;
      position: relative;
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reclose-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .reclose-btn:hover {
      background: #F8ECE0;
      color: var(--primary);
    }

    @media (max-width: 540px) {
      .useless-btn {
        top: 10px;
        right: 10px;
        font-size: 11px;
        padding: 6px 12px;
      }
      .tabs-bar {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .tab-btn {
        flex-direction: row;
        padding: 8px 6px;
        gap: 6px;
        justify-content: flex-start;
      }
      .tab-avatar {
        width: 24px;
        height: 24px;
        font-size: 11px;
      }
      .tab-btn span {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .envelope-box {
        max-width: 320px;
        height: 220px;
      }
      .env-top-tri {
        border-left-width: 158px;
        border-right-width: 158px;
        border-top-width: 115px;
      }
      .env-bot-tri {
        border-left-width: 158px;
        border-right-width: 158px;
        border-bottom-width: 105px;
      }
      .env-side-left, .env-side-right {
        border-top-width: 110px;
        border-bottom-width: 110px;
      }
      .env-side-left { border-left-width: 120px; }
      .env-side-right { border-right-width: 120px; }
      .heart-seal {
        top: 85px;
        width: 50px;
        height: 50px;
      }
      .airmail-badge {
        bottom: 18px;
        padding: 6px 16px;
      }
      .card-wrap {
        padding: 24px 16px;
      }
      .card-title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Right Useless Button -->
  <button class="useless-btn" onclick="startCinemaLoop()">
    <span>🤡</span> button that does nothing
  </button>

  <!-- Cinema Poster Mode Overlay -->
  <div class="cinema-overlay" id="cinemaOverlay">
    <div class="cinema-frame" id="cinemaFrame">
      <img src="blamesweet.png" class="cinema-slide" alt="blamesweet" id="slide0">
      <img src="depression.png" class="cinema-slide" alt="depression" id="slide1">
      <img src="lol.png" class="cinema-slide" alt="lol" id="slide2">
    </div>
    <button class="cinema-back-btn" onclick="stopCinemaLoop()">
      🔙 Go back
    </button>
  </div>

  <div class="balloon-layer" id="balloonLayer"></div>

  <div class="scene-wrap">

    <div class="envelope-box" id="envelopeBox" onclick="openEnvelope()">
      <div class="env-top-tri" id="envelopeFlap"></div>
      <div class="env-side-left"></div>
      <div class="env-side-right"></div>
      <div class="env-bot-tri"></div>

      <div class="heart-seal">
        <span>💌</span>
        <small>OPEN</small>
      </div>

      <div class="airmail-badge">
        <div class="tag">Special Delivery</div>
        <div class="to">For Toz on her 16th 🎀</div>
      </div>
    </div>
    
    <div class="open-prompt" id="openPrompt">
      <span>✨ Tap the envelope to unseal</span>
    </div>

    <div class="card-wrap" id="birthdayCard">
      <div class="card-header">
        <div class="date-pill">🗓️ November 3rd • Sweet 16th</div>
        <h1 class="card-title">Happy Birthday, <span>Toz!</span> 🎉</h1>
        <p class="birthday-quote">"Wishing you the brightest year full of laughter, love & memories!"</p>
      </div>

      <div class="cake-showcase">
        <div class="cake-container" onclick="toggleCandles()" title="Tap to blow out or relight the candles!">
          <div class="candles-wrapper">
            <div class="candle-unit">
              <div class="smoke" id="smoke1"></div>
              <div class="flame" id="flame1"></div>
              <div class="wick"></div>
              <div class="stick"></div>
            </div>
            <div class="candle-unit">
              <div class="smoke" id="smoke2"></div>
              <div class="flame" id="flame2"></div>
              <div class="wick"></div>
              <div class="stick"></div>
            </div>
          </div>

          <div class="cake-tier-top">
            <div class="frosting-drips"></div>
          </div>

          <div class="cake-tier-bottom"></div>

          <div class="cake-plate"></div>
        </div>

        <div class="cake-hint" id="candleStatus" onclick="toggleCandles()">
          Tap candles to make a 16th wish & blow them out 💨
        </div>
      </div>

      <span class="tabs-label">Messages from friends:</span>
      <div class="tabs-bar" id="tabsBar"></div>

      <div class="wish-box" id="wishBox">
        <div class="wish-header">
          <div class="big-avatar" id="authorAvatar"></div>
          <div class="wish-meta">
            <h3 id="authorName">Cas</h3>
            <span id="authorRole">Bestie</span>
          </div>
        </div>
        <p class="wish-text" id="wishContent"></p>
      </div>

      <div class="card-actions">
        <button class="reclose-btn" onclick="closeEnvelope()">
          ✉️ Put card back in envelope
        </button>
      </div>
    </div>

  </div>

  <script>
    const ripAudio = new Audio('paper-ripping.mp3');
    const bdayAudio = new Audio('bdaymusic.mp3');
    bdayAudio.loop = true;

    const tuffAudio = new Audio('tuffsong.mp3');
    tuffAudio.loop = true;

    const wishes = [
      {
        id: "cas",
        name: "Cas",
        role: "Friend",
        img: "cas.png",
        message: "happy birthday toz, um 16th bday yes happy birthday and ur 1 year closer to death. honestly crazy you survived this long without accidentally doing something stupid, but congrats on making it to 16 i guess. enjoy the back pain and adult problems heading your way soon"
      },
      {
        id: "sweet",
        name: "Sweet",
        role: "Friend",
        img: "sweet.png",
        message: "HAPPY BIRTHDAY TOZZZ!!\n\nI genuinely don't think you realise how much you mean to me. You're such a cool person to have around, and I'm really glad I got to know you. I know things haven't always been the easiest for you, and there's been your fair share of drama and everything, but despite all of that, you've still managed to be such a helpful and caring friend to me.\n\nContinue being my friend, yea? And let's get positive now, cause no one wants a sad birthday, now do we?\n\nWishing you all the best in your future endeavours. I hope life has plenty of good things waiting for you.\n\nYour friend,\nSweet"
      },
      {
        id: "tsumiki",
        name: "Tsumiki",
        role: "Friend",
        img: "tsumiki.png",
        message: "HAPPIEST BIRTHDAY TOZ!!\n\nYou've become a friend so close who helped me when I was at my lowest and you've let me step into your world.. you're just so beautiful, more beautiful than your art itself and you're always so supportive! You've always had my back and gave me strength and a whole new perspective on things... happy birthday again, #iloveyousomuchhh!!"
      },
      {
        id: "ren",
        name: "Ren",
        role: "Friend",
        img: "ren.png",
        message: "HAPPIEST BIRTHDAY WISHES TO MY ABSOLUTE BESTFRIEND TOZZY WOZZY, idk if its been 2 or 3 years but lwk i lost count cuz lwk time flies what can i say and lwk im glad i got to be your friend and glad i still am cuz lwk throught the entire life ive lived till now your and our friend group has been my no . 1 core memory id sacrifice anything to get back to the start and repeat our memories cuz no matter what happened i lwk would say our bond is something id give the world for trust me even tho i know you wont but i will ask because yes why not and lwk i remember our times in TOH and lwk remember almost everything that happened before i may not have been around much but i lwk never can forget you or anyone else broski happiest birthday wishes hope we never stop our grind best wishes for our future i lwk dont want our friend group to ever cease to exist at the end of the day i know fs one of the best days in my life has started from this group and hope you dont ever hate me cuz i could never and if u do that lwk gonna burn my ass but asides allat lwk unblock me cuz im goated af and yet again HAPPIEST BIRTHDAY WISHES TOZZY WOZZY ❤️ < 3"
      },
      {
        id: "rusher",
        name: "Rusher",
        role: "Friend",
        img: "rusher.png",
        message: "Happy 16th Birthday, Toz! Wishing you the brightest year ahead, packed with non-stop happiness, big wins, and everything you’ve been hoping for. You deserve it all!"
      },
      {
        id: "alex",
        name: "Alex",
        role: "Friend",
        img: "alex.png",
        message: "Happy 16th birthday Toz! Hope you have the absolute best day and an even better year ahead. 16 is a massive milestone and wishing you nothing but genuine happiness and success and good things on whatever path you take from here. Looking back I know we had our fair share of rough patches stupid fights and unnecessary drama. I genuinely want to apologize for the times I acted like a complete jackass and said things out of line that hurt you. Despite all the dumb moments I still consider you a real friend and I hope this year brings you peace great memories and people who appreciate you. Have an amazing day happy birthday and remember you're officially 1 year closer to death."
      }
    ];

    let activeTabId = "cas";
    let candlesBlown = false;

    /* Cinema Loop State */
    let cinemaInterval = null;
    let currentSlide = 0;
    const totalSlides = 3;

    function startCinemaLoop() {
      bdayAudio.pause();

      tuffAudio.currentTime = 0;
      tuffAudio.play().catch(() => {});

      fireConfettiBurst();

      const overlay = document.getElementById('cinemaOverlay');
      overlay.style.display = 'flex';
      setTimeout(() => overlay.classList.add('active'), 10);

      currentSlide = 0;
      showSlide(currentSlide);

      clearInterval(cinemaInterval);
      cinemaInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        showSlide(currentSlide);
      }, 4000);
    }

    function showSlide(index) {
      for (let i = 0; i < totalSlides; i++) {
        const slide = document.getElementById(`slide${i}`);
        slide.classList.remove('show');
      }
      const activeSlide = document.getElementById(`slide${index}`);
      void activeSlide.offsetWidth;
      activeSlide.classList.add('show');
    }

    function stopCinemaLoop() {
      tuffAudio.pause();
      tuffAudio.currentTime = 0;

      if (document.getElementById('birthdayCard').style.display === 'block') {
        bdayAudio.play().catch(() => {});
      }

      clearInterval(cinemaInterval);
      const overlay = document.getElementById('cinemaOverlay');
      overlay.classList.remove('active');
      setTimeout(() => {
        overlay.style.display = 'none';
        for (let i = 0; i < totalSlides; i++) {
          document.getElementById(`slide${i}`).classList.remove('show');
        }
      }, 350);
    }

    function renderTabs() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.innerHTML = '';

      wishes.forEach(friend => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${friend.id === activeTabId ? 'active' : ''}`;
        btn.onclick = () => selectTab(friend.id);

        btn.innerHTML = `
          <div class="tab-avatar">
            <img src="${friend.img}" alt="${friend.name}" onerror="this.onerror=null; this.parentElement.innerText='${friend.name[0]}';">
          </div>
          <span>${friend.name}</span>
        `;
        tabsBar.appendChild(btn);
      });

      renderCurrentWish();
    }

    function selectTab(id) {
      activeTabId = id;
      renderTabs();
    }

    function renderCurrentWish() {
      const current = wishes.find(w => w.id === activeTabId) || wishes[0];
      
      document.getElementById('authorName').innerText = current.name;
      document.getElementById('authorRole').innerText = current.role;
      document.getElementById('wishContent').innerText = `"${current.message}"`;

      const avatarBox = document.getElementById('authorAvatar');
      avatarBox.innerHTML = `
        <img src="${current.img}" alt="${current.name}" onerror="this.onerror=null; this.parentElement.innerText='${current.name[0]}';">
      `;
    }

    function openEnvelope() {
      ripAudio.currentTime = 0;
      ripAudio.play().catch(() => {});

      bdayAudio.currentTime = 0;
      bdayAudio.play().catch(() => {});

      const flap = document.getElementById('envelopeFlap');
      flap.style.transform = "rotateX(180deg)";
      
      fireConfettiBurst();

      setTimeout(() => {
        document.getElementById('envelopeBox').style.display = 'none';
        document.getElementById('openPrompt').style.display = 'none';
        document.getElementById('birthdayCard').style.display = 'block';
      }, 350);
    }

    function closeEnvelope() {
      bdayAudio.pause();
      bdayAudio.currentTime = 0;

      const flap = document.getElementById('envelopeFlap');
      document.getElementById('birthdayCard').style.display = 'none';
      document.getElementById('envelopeBox').style.display = 'flex';
      document.getElementById('openPrompt').style.display = 'flex';
      flap.style.transform = "rotateX(0deg)";
    }

    function fireConfettiBurst() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#FF6B8B', '#FFD166', '#06D6A0', '#118AB2', '#FFAAA6']
        });
        setTimeout(() => {
          confetti({
            particleCount: 45,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 45,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
        }, 220);
      }
    }

    function toggleCandles() {
      const f1 = document.getElementById('flame1');
      const f2 = document.getElementById('flame2');
      const s1 = document.getElementById('smoke1');
      const s2 = document.getElementById('smoke2');
      const status = document.getElementById('candleStatus');

      candlesBlown = !candlesBlown;

      if (candlesBlown) {
        f1.classList.add('blown');
        f2.classList.add('blown');
        
        s1.classList.remove('active');
        s2.classList.remove('active');
        void s1.offsetWidth;
        s1.classList.add('active');
        s2.classList.add('active');

        status.innerHTML = "✨ Wish granted! Happy 16th Toz! (Tap to relight) 🕯️";
        fireConfettiBurst();
      } else {
        f1.classList.remove('blown');
        f2.classList.remove('blown');
        s1.classList.remove('active');
        s2.classList.remove('active');
        status.innerHTML = "Tap candles to make a 16th wish & blow them out 💨";
      }
    }

    function createAmbientBalloons() {
      const container = document.getElementById('balloonLayer');
      const colors = ['#FFC2D1', '#FFE5D9', '#D8E2DC', '#FFE8D6', '#E8DFF5'];
      
      for (let i = 0; i < 7; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.style.left = `${Math.random() * 92 + 2}%`;
        balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.animationDelay = `${Math.random() * 8}s`;
        balloon.style.animationDuration = `${12 + Math.random() * 6}s`;
        container.appendChild(balloon);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      createAmbientBalloons();
    });
  </script>
</body>
</html>
