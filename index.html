<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy 16th Birthday Toz! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #FFF7ED;
      --card-bg: #FFFFFF;
      --envelope-base: #FCEFD8;
      --envelope-flap: #F5DFB8;
      --envelope-dark: #E6CE9F;
      --accent: #FF6B8B;
      --accent-soft: #FFE3E8;
      --primary: #59352A;
      --muted: #8F7265;
      --border-color: #EED7C5;
      --shadow: 0 16px 36px -12px rgba(93, 56, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#F5DFC9 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      font-family: 'Nunito', sans-serif;
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Ambient Balloons */
    .balloon-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.75;
      animation: floatUp 14s infinite linear;
      bottom: -70px;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: #C4A482;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; }
    }

    /* Card & Envelope Container */
    .scene-wrap {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 10;
      perspective: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= CLOSED ENVELOPE ================= */
    .envelope-box {
      width: 100%;
      max-width: 440px;
      height: 300px;
      background: var(--envelope-base);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(89, 53, 42, 0.16);
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--envelope-dark);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      overflow: hidden;
    }

    .envelope-box:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 24px 44px rgba(89, 53, 42, 0.2);
    }

    .env-top-tri {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 217px solid transparent;
      border-right: 217px solid transparent;
      border-top: 155px solid var(--envelope-flap);
      z-index: 4;
      transform-origin: top center;
      transition: transform 0.6s ease;
    }

    .env-bot-tri {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 217px solid transparent;
      border-right: 217px solid transparent;
      border-bottom: 140px solid var(--envelope-base);
      z-index: 3;
    }

    .env-side-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 150px solid transparent;
      border-bottom: 150px solid transparent;
      border-left: 170px solid var(--envelope-dark);
      opacity: 0.35;
      z-index: 2;
    }

    .env-side-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 150px solid transparent;
      border-bottom: 150px solid transparent;
      border-right: 170px solid var(--envelope-dark);
      opacity: 0.35;
      z-index: 2;
    }

    .heart-seal {
      position: absolute;
      top: 125px;
      z-index: 6;
      width: 60px;
      height: 60px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 6px 16px rgba(255, 107, 139, 0.45);
      border: 3px solid #FFF;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
    }

    .heart-seal span {
      font-size: 20px;
      line-height: 1;
    }

    .heart-seal small {
      font-size: 8px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .airmail-badge {
      position: absolute;
      bottom: 30px;
      z-index: 5;
      background: #FFFFFF;
      padding: 10px 22px;
      border-radius: 30px;
      border: 2px dashed #E3BFA5;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }

    .airmail-badge .tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .airmail-badge .to {
      font-size: 15px;
      font-weight: 900;
      color: var(--primary);
    }

    .open-prompt {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* ================= OPEN CARD ================= */
    .card-wrap {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border-radius: 28px;
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
    }

    .card-title span {
      color: var(--accent);
    }

    .birthday-quote {
      font-family: 'Caveat', cursive;
      font-size: 23px;
      color: #9E5A47;
      text-align: center;
      margin: 4px 0 20px;
    }

    /* Mini Cake Interaction */
    .cake-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #FFF9F3;
      border: 1.5px dashed #F0D5C3;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .cake-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 8px;
    }

    .candle-group {
      display: flex;
      gap: 16px;
      cursor: pointer;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .flame {
      width: 14px;
      height: 22px;
      background: radial-gradient(#FFF07C 30%, #FF9900 70%, transparent 95%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 14px #FFB300;
      animation: flicker 0.8s infinite alternate;
      transition: all 0.3s ease;
    }

    .flame.blown {
      opacity: 0;
      transform: translateY(-8px) scale(0.2);
    }

    @keyframes flicker {
      0% { transform: rotate(-2deg) scale(1); }
      100% { transform: rotate(3deg) scale(1.08); }
    }

    .candle-stick {
      width: 12px;
      height: 38px;
      border-radius: 4px;
      background: repeating-linear-gradient(45deg, #FF9FB2, #FF9FB2 6px, #FFF 6px, #FFF 12px);
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
    }

    .cake-base {
      font-size: 38px;
      line-height: 1;
    }

    .cake-status {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }

    .cake-status:hover {
      color: var(--accent);
    }

    /* Friend Message Tabs */
    .tabs-label {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #F8EFE6;
      border: 1.5px solid transparent;
      border-radius: 50px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #F1E4D6;
    }

    .tab-btn.active {
      background: #FFFFFF;
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.16);
    }

    .tab-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: #F1D4CA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      overflow: hidden;
    }

    .tab-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Wish Display Box */
    .wish-box {
      background: #FFFDF9;
      border: 1.5px solid #F1E2D4;
      border-radius: 20px;
      padding: 22px;
      position: relative;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(93, 56, 42, 0.04);
    }

    .wish-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .big-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: #F7E4DE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--accent);
      flex-shrink: 0;
    }

    .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .wish-meta h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
    }

    .wish-meta span {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .wish-text {
      font-size: 15px;
      line-height: 1.6;
      color: #634335;
      position: relative;
    }

    /* Actions bottom */
    .card-actions {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reclose-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .reclose-btn:hover {
      background: #F8ECE0;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Floating background balloons -->
  <div class="balloon-layer" id="balloonLayer"></div>

  <div class="scene-wrap">

    <!-- CLOSED ENVELOPE VIEW -->
    <div class="envelope-box" id="envelopeBox" onclick="openEnvelope()">
      <div class="env-top-tri" id="envelopeFlap"></div>
      <div class="env-side-left"></div>
      <div class="env-side-right"></div>
      <div class="env-bot-tri"></div>

      <div class="heart-seal">
        <span>💌</span>
        <small>OPEN</small>
      </div>

      <div class="airmail-badge">
        <div class="tag">Special Delivery</div>
        <div class="to">For Toz on her 16th 🎀</div>
      </div>
    </div>
    
    <div class="open-prompt" id="openPrompt">
      <span>✨ Tap the envelope to unseal</span>
    </div>

    <!-- OPENED CARD VIEW -->
    <div class="card-wrap" id="birthdayCard">
      <div class="card-header">
        <div class="date-pill">🗓️ November 3rd • Sweet 16th</div>
        <h1 class="card-title">Happy Birthday, <span>Toz!</span> 🎉</h1>
        <p class="birthday-quote">"Wishing you the brightest year full of laughter, love & memories!"</p>
      </div>

      <!-- Interactive Candles -->
      <div class="cake-section">
        <div class="cake-row">
          <div class="candle-group" onclick="toggleCandles()" title="Tap to blow out candles!">
            <div class="candle">
              <div class="flame" id="flame1"></div>
              <div class="candle-stick"></div>
            </div>
            <div class="candle">
              <div class="flame" id="flame2"></div>
              <div class="candle-stick"></div>
            </div>
          </div>
          <div class="cake-base">🎂</div>
        </div>
        <div class="cake-status" id="candleStatus" onclick="toggleCandles()">
          Tap candles to make a wish & blow them out 💨
        </div>
      </div>

      <!-- Friend Message Tabs -->
      <span class="tabs-label">Messages from friends:</span>
      <div class="tabs-bar" id="tabsBar">
        <!-- Rendered by JS -->
      </div>

      <!-- Friend Wish Content -->
      <div class="wish-box" id="wishBox">
        <div class="wish-header">
          <div class="big-avatar" id="authorAvatar"></div>
          <div class="wish-meta">
            <h3 id="authorName">Cas</h3>
            <span id="authorRole">Bestie</span>
          </div>
        </div>
        <p class="wish-text" id="wishContent"></p>
      </div>

      <!-- Bottom Re-close Option -->
      <div class="card-actions">
        <button class="reclose-btn" onclick="closeEnvelope()">
          ✉️ Put card back in envelope
        </button>
      </div>
    </div>

  </div>

  <script>
    // 1. Data for friends with profile picture filenames from GitHub repo
    const wishes = [
      {
        id: "cas",
        name: "Cas",
        role: "Friend",
        img: "cas.png",
        message: "HAPPY 16TH BIRTHDAY TOZ!! 🎉 Can't believe you're 16 already! You're honestly one of the best people to be around, always keeping things so fun and memorable. I hope today gives you everything you've wished for and so much more! Never change! 💕"
      },
      {
        id: "sweet",
        name: "Sweet",
        role: "Friend",
        img: "sweet.png",
        message: "Toz, sweetest 16th to you! 🌸 You have such a kind and vibrant heart, and every memory we make together is unforgettable. May this year bring you all the success, happiness, and peace in the world. Enjoy every single moment of your special day! 🍰✨"
      },
      {
        id: "tsumiki",
        name: "Tsumiki",
        role: "Friend",
        img: "tsumiki.png",
        message: "Happy sweet sixteen, Toz!! 🎀 Wishing you tons of love, sweet cake, and zero stress! Thank you for being such an awesome friend and always bringing smiles to everyone. You deserve the happiest year ahead!"
      },
      {
        id: "ren",
        name: "Ren",
        role: "Friend",
        img: "ren.png",
        message: "Happy Birthday Toz!! 🎂 16 is a huge milestone! I hope you get celebrated like the queen you are today. Keep shining, dreaming big, and staying true to yourself. Let's make this year an absolute masterpiece!"
      },
      {
        id: "alex",
        name: "Alex",
        role: "Friend",
        img: "alex.png",
        message: "Happy 16th Toz! 🎈 Super grateful to have you in my circle. You bring so much good energy and joy wherever you go. Eat lots of good food today and have the most incredible birthday!"
      }
    ];

    let activeTabId = "cas";
    let candlesBlown = false;

    // 2. Tab and Content Rendering with Image Fallbacks
    function renderTabs() {
      const tabsBar = document.getElementById('tabsBar');
      tabsBar.innerHTML = '';

      wishes.forEach(friend => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${friend.id === activeTabId ? 'active' : ''}`;
        btn.onclick = () => selectTab(friend.id);

        btn.innerHTML = `
          <div class="tab-avatar">
            <img src="${friend.img}" alt="${friend.name}" onerror="this.onerror=null; this.parentElement.innerText='${friend.name[0]}';">
          </div>
          <span>${friend.name}</span>
        `;
        tabsBar.appendChild(btn);
      });

      renderCurrentWish();
    }

    function selectTab(id) {
      activeTabId = id;
      renderTabs();
    }

    function renderCurrentWish() {
      const current = wishes.find(w => w.id === activeTabId) || wishes[0];
      
      document.getElementById('authorName').innerText = current.name;
      document.getElementById('authorRole').innerText = current.role;
      document.getElementById('wishContent').innerText = `"${current.message}"`;

      const avatarBox = document.getElementById('authorAvatar');
      avatarBox.innerHTML = `
        <img src="${current.img}" alt="${current.name}" onerror="this.onerror=null; this.parentElement.innerText='${current.name[0]}';">
      `;
    }

    // 3. Envelope Open / Close Logic + Confetti
    function openEnvelope() {
      const flap = document.getElementById('envelopeFlap');
      flap.style.transform = "rotateX(180deg)";
      
      // Fire celebration confetti automatically upon opening
      fireConfettiBurst();

      setTimeout(() => {
        document.getElementById('envelopeBox').style.display = 'none';
        document.getElementById('openPrompt').style.display = 'none';
        document.getElementById('birthdayCard').style.display = 'block';
      }, 350);
    }

    function closeEnvelope() {
      const flap = document.getElementById('envelopeFlap');
      document.getElementById('birthdayCard').style.display = 'none';
      document.getElementById('envelopeBox').style.display = 'flex';
      document.getElementById('openPrompt').style.display = 'flex';
      flap.style.transform = "rotateX(0deg)";
    }

    // 4. Confetti trigger
    function fireConfettiBurst() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#FF6B8B', '#FFD166', '#06D6A0', '#118AB2', '#FFAAA6']
        });
        setTimeout(() => {
          confetti({
            particleCount: 50,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
          });
          confetti({
            particleCount: 50,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
          });
        }, 250);
      }
    }

    // 5. Candle Blow Interaction
    function toggleCandles() {
      const f1 = document.getElementById('flame1');
      const f2 = document.getElementById('flame2');
      const status = document.getElementById('candleStatus');

      candlesBlown = !candlesBlown;

      if (candlesBlown) {
        f1.classList.add('blown');
        f2.classList.add('blown');
        status.innerHTML = "✨ Wish granted! Happy 16th Toz! (Tap to relight) 🕯️";
        fireConfettiBurst();
      } else {
        f1.classList.remove('blown');
        f2.classList.remove('blown');
        status.innerHTML = "Tap candles to make a wish & blow them out 💨";
      }
    }

    // 6. Subtle background balloons
    function createAmbientBalloons() {
      const container = document.getElementById('balloonLayer');
      const colors = ['#FFC2D1', '#FFE5D9', '#D8E2DC', '#FFE8D6', '#E8DFF5'];
      
      for (let i = 0; i < 7; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.style.left = `${Math.random() * 92 + 2}%`;
        balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.animationDelay = `${Math.random() * 8}s`;
        balloon.style.animationDuration = `${12 + Math.random() * 6}s`;
        container.appendChild(balloon);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      createAmbientBalloons();
    });
  </script>
</body>
</html>
